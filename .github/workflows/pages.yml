name: Deploy studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r studio/. _site/
          cp dist/bitkit-studio.html _site/bitkit-studio.html
          # GitHub Pages lets browsers cache files for 10 minutes. Give every script and
          # stylesheet a per-build address so a reload never mixes old and new files.
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"([^\":]+\.(js|css))\"#\1=\"\2?v=$v\"#g" _site/index.html
          sed -i "s#<script src=\"runtime.js?v=$v\"></script>#<script>window.BK_BUILD='$v'</script>\n&#" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
