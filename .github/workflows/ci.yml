name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime and demo checks
        run: node tools/ci.cjs
      - name: Beacon Keeper checks
        run: node tools/harbourtest.cjs
      - name: Game shell and game rules
        run: node tools/gametest.cjs
      - name: Title screens
        run: node tools/titletest.cjs
      - name: Sprout Hop levels screen and stats
        run: node tools/levelstest.cjs
      - name: Sweep Storm and network events
        run: node tools/sweeptest.cjs
      - name: Crossgate checks
        run: node tools/crossgatetest.cjs
      - name: Tinwing checks
        run: node tools/tinwingtest.cjs
      - name: Shaders and Deepglow
        run: node tools/shadertest.cjs
      - name: Music player, Hexbeat and Loopbox
        run: node tools/musictest.cjs
      - name: Puffball, Hedge Hogs and Cauldron Crew
        run: node tools/partytest.cjs
      - name: Mind Laps (five exercises, daily jog and streak, race, team, linked Bits)
        run: node tools/mindlapstest.cjs
      - name: Windrow
        run: node tools/windrowtest.cjs
      - name: Emulator apps (WASM)
        run: node tools/emutest.cjs
      - name: Emulators built natively, like the device firmware
        run: tools/emutest_native.sh
      - name: Themes and player names
        run: node tools/themetest.cjs
      - name: Photos and clips (capture module)
        run: node tools/capturetest.cjs
      - name: Share hub publisher
        run: node tools/hubtest.cjs

  device:
    # the PocketBit host (platform/device) on Linux: plays every built-in game and app through the device code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export the games and apps for the device
        run: node tools/export_device.cjs build/device-flash
      - name: Put the emulator test cards on the memory card
        run: python3 tools/make_test_roms.py build/device-data/roms
      - name: Build the headless PocketBit
        run: platform/sim/build.sh
      - name: Play every game and app on the device host
        run: platform/sim/build/bitsim --test build/device-flash build/device-data --frames 1200 --report build/device-report.md
      - name: Two linked Bits (lockstep, pause together, net_send) with packets lost
        run: platform/sim/build/bitsim --link build/device-flash build/device-link --loss 15
      - name: Two linked Bits playing Mind Laps (race or team in lockstep) with packets lost
        run: platform/sim/build/bitsim --link build/device-flash build/device-link-ml --loss 15 --game "Mind Laps"
      - name: Two Bits share a game and a photo with the Share app, with packets lost
        run: platform/sim/build/bitsim --share build/device-flash build/device-share --loss 15
      - name: Frame times on the CI machine
        if: always()
        run: cat build/device-report.md >> "$GITHUB_STEP_SUMMARY" || true

  firmware:
    # the real ESP32-S3 firmware, built with ESP-IDF 5.3; the flashable files are kept as a build artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export the games and apps into the firmware's flash disk
        run: node tools/export_device.cjs
      - name: Build the firmware (ESP-IDF 5.3, ESP32-S3)
        run: |
          docker run --rm -v "$PWD:/bitkit" -w /bitkit/platform/esp32s3 espressif/idf:v5.3.2 \
            bash -c 'idf.py set-target esp32s3 && idf.py build && idf.py size | tee build/size.txt && \
              idf.py -B build-bench -DSDKCONFIG=build-bench/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench" build'
      - name: Collect the files to flash
        run: |
          B=platform/esp32s3/build
          mkdir -p pocketbit-firmware
          cp $B/bootloader/bootloader.bin $B/partition_table/partition-table.bin $B/pocketbit.bin $B/storage.bin $B/flash_args pocketbit-firmware/
          sed -i 's#bootloader/##; s#partition_table/##' pocketbit-firmware/flash_args
          cp platform/esp32s3/FLASHING.txt pocketbit-firmware/
          # the benchmark build: same flash disk, measures every game at boot (docs/DEVICE.md, "Frame budget")
          mkdir -p pocketbit-firmware/benchmark
          cp platform/esp32s3/build-bench/pocketbit.bin pocketbit-firmware/benchmark/
          echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E "DIRAM|Flash Code|Flash Data|Total image" $B/size.txt >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbit-firmware
          path: pocketbit-firmware/

  linked-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          # the system packages come from the Ubuntu mirrors, which are sometimes unreachable from the runner;
          # the runner image already has Chrome and its libraries, so fall back to the browser alone
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Linked Bits (browser)
        run: node tools/linktest.cjs
      - name: Emulator apps (browser)
        run: node tools/emubrowsertest.cjs
      - name: Share hub (browser)
        run: node tools/sharetest.cjs
      - name: Share app, Bit to Bit (browser)
        run: node tools/shareapptest.cjs
      - name: Share website (browser)
        run: node tools/hubsitetest.cjs
